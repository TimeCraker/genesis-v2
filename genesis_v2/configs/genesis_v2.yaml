environment:
  batch_size: 16
  batch_wait_ms: 100
  comm_radius: 2
  context_window: 64
  embed_dim: 1536
  fallback_to_mock: true
  grid_cols: 10
  grid_rows: 10
  per_island_budget_usd: 15.0
  projection_seed: 42
  temperature: 0.0
  top_p: 0.0
  total_budget_usd: 50.0
  type: mock
evaluation:
  modularity_algo: louvain
  multiscale_horizons:
  - 1
  - 4
  - 16
  ood_prompt_file: ./data/ood_prompts.txt
  probe_interval_generations: 10
evolution:
  generation_ticks: 200
  migration_interval_generations: 50
  tick_rate: 2
genome:
  initial_edge_density: 0.2
  initial_hidden_nodes: 4
  input_nodes: 8
  node_dim: 64
  output_nodes_action: 4
  output_nodes_message: 2
  output_nodes_selfmod: 1
  output_nodes_state: 2
physics:
  alpha: 0.01
  beta: 0.005
  death_penalty: 500.0
  delta: 0.002
  epsilon: 0.1
  gamma: 0.001
  initial_energy: 5000.0
  selfmod_death_rate: 0.7
  selfmod_energy_cost: 1000.0
  selfmod_energy_threshold: 10000.0
  topology_entropy_threshold: 5.0
  w_adapt: 0.5
  w_bvar: 0.3
  w_comp: 0.5
  w_explore: 0.2
  w_pred: 1.0
  w_social: 0.3
  zeta: 0.01
population:
  islands:
  - backend: deepseek
    mutation_rate: 0.3
    name: Explorer
    size: 100
  - backend: deepseek
    mutation_rate: 0.05
    name: Exploiter
    size: 100
  - backend: deepseek
    mutation_rate: 0.15
    name: RecurrentOnly
    size: 100
  - backend: mock
    mutation_rate: 0.15
    name: ShortcutOnly
    size: 100
