[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genesis-v2"
version = "2.0.0"
description = "Multi-LLM Semantic Wilderness — Autonomous AGI Evolution Platform"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "duckdb>=0.10",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.90",
    "pytest-asyncio>=0.23",
]
viz = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

[project.scripts]
genesis_v2 = "genesis_v2.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
