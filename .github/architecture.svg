<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Genesis v2 进化循环">
  <defs>
    <style>
      .tt  { font: 600 20px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #FAF6F0; }
      .ts  { font: 600 12px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #78716C; letter-spacing: 3px; }
      .st  { font: 600 14px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #CC785C; letter-spacing: 1.5px; }
      .sd  { font: 400 11px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #A8A29E; }
      .ctr { font: 900 26px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #FAF6F0; letter-spacing: 2px; }
      .ctd { font: 400 11px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #78716C; letter-spacing: 1.5px; }
      .icon{ stroke: #CC785C; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node{ fill: #CC785C; }
      .box { fill: #211D1A; stroke: #2E2A27; stroke-width: 1; }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78716C"/>
    </marker>
  </defs>

  <rect width="1280" height="620" rx="18" fill="#1C1917"/>
  <rect x="56" y="48" width="26" height="2" fill="#CC785C"/>
  <text x="56" y="76" class="ts">EVOLUTION LOOP · 0.5 HZ / TICK</text>
  <text x="54" y="112" class="tt">进化循环 · 六阶段闭环</text>

  <!-- 中心 -->
  <g transform="translate(640,360)">
    <circle r="132" fill="none" stroke="#2E2A27" stroke-width="1"/>
    <circle r="86" fill="none" stroke="#CC785C" stroke-width="1" opacity="0.3"/>
    <text y="-2" text-anchor="middle" class="ctr">EVOLUTION</text>
    <text y="24" text-anchor="middle" class="ctd">closed loop</text>
  </g>

  <!-- ── 六阶段：环形布局 ── -->
  <!-- 顶部 BIRTH -->
  <g transform="translate(640,168)">
    <rect x="-118" y="-34" width="236" height="68" rx="10" class="box"/>
    <g transform="translate(-96,-16)" class="icon">
      <ellipse cx="9" cy="7" rx="8" ry="10"/>
      <path d="M9 -4 a5 5 0 0 1 0 10 a5 5 0 0 0 0 10" opacity="0.7"/>
    </g>
    <text x="-68" y="-4" class="st">BIRTH</text>
    <text x="-68" y="16" class="sd">Breeder 生成新基因组</text>
  </g>

  <!-- 右上 MUTATE -->
  <g transform="translate(1004,258)">
    <rect x="-118" y="-34" width="236" height="68" rx="10" class="box"/>
    <g transform="translate(-96,-18)" class="icon">
      <path d="M0 0 Q12 9 0 18 Q-12 27 0 36"/>
      <path d="M20 0 Q8 9 20 18 Q32 27 20 36"/>
      <line x1="2" y1="9" x2="18" y2="9"/><line x1="-2" y1="18" x2="22" y2="18"/><line x1="2" y1="27" x2="18" y2="27"/>
    </g>
    <text x="-64" y="-4" class="st">MUTATE</text>
    <text x="-64" y="16" class="sd">基因组交叉 + 噪声</text>
  </g>

  <!-- 右下 EXPLORE -->
  <g transform="translate(1004,462)">
    <rect x="-118" y="-34" width="236" height="68" rx="10" class="box"/>
    <g transform="translate(-98,-16)" class="icon">
      <circle cx="9" cy="9" r="7.5"/>
      <path d="M9 1.5 V-6 M9 16.5 V24 M1.5 9 H-6 M16.5 9 H24" opacity="0.6"/>
    </g>
    <text x="-64" y="-4" class="st">EXPLORE</text>
    <text x="-64" y="16" class="sd">多 LLM 语义环境试错</text>
  </g>

  <!-- 底部 EVALUATE -->
  <g transform="translate(640,552)">
    <rect x="-118" y="-34" width="236" height="68" rx="10" class="box"/>
    <g transform="translate(-96,-17)" class="icon">
      <path d="M20 4 L8 20 L0 12"/>
    </g>
    <text x="-64" y="-4" class="st">EVALUATE</text>
    <text x="-64" y="16" class="sd">同行评分 + 自适应探针</text>
  </g>

  <!-- 左下 REAP -->
  <g transform="translate(276,462)">
    <rect x="-118" y="-34" width="236" height="68" rx="10" class="box"/>
    <g transform="translate(-97,-18)" class="icon">
      <path d="M6 0 V28 M6 0 L20 12 L6 24" transform="rotate(-14 10 14)"/>
      <line x1="24" y1="0" x2="24" y2="28" opacity="0.6"/>
    </g>
    <text x="-64" y="-4" class="st">REAP</text>
    <text x="-64" y="16" class="sd">淘汰低声誉基因组</text>
  </g>

  <!-- 左上 INHERIT -->
  <g transform="translate(276,258)">
    <rect x="-118" y="-34" width="236" height="68" rx="10" class="box" stroke="#CC785C" stroke-width="1.2"/>
    <g transform="translate(-98,-18)" class="icon">
      <path d="M10 0 L20 5.8 V17.4 L10 23.2 L0 17.4 V5.8 Z"/>
      <path d="M0 5.8 L10 11.6 L20 5.8 M10 11.6 V23.2"/>
    </g>
    <text x="-66" y="-4" class="st">INHERIT</text>
    <text x="-66" y="16" class="sd">精英写入 Survivor Bank</text>
  </g>

  <!-- 环流箭头（顺时针） -->
  <g fill="none" stroke="#57534E" stroke-width="1.4">
    <path d="M786 208 Q896 220 916 240" marker-end="url(#ar)"/>
    <path d="M1018 330 Q1018 380 1000 414" marker-end="url(#ar)"/>
    <path d="M908 520 Q800 548 782 546" marker-end="url(#ar)"/>
    <path d="M500 546 Q380 540 350 512" marker-end="url(#ar)"/>
    <path d="M262 420 Q240 370 258 336" marker-end="url(#ar)"/>
    <path d="M370 224 Q480 196 502 202" marker-end="url(#ar)"/>
  </g>
</svg>
