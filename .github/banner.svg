<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Genesis v2">
  <defs>
    <style>
      .wm  { font: 900 54px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #FAF6F0; letter-spacing: 1px; }
      .tag { font: 600 12px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #CC785C; letter-spacing: 5px; }
      .sub { font: 400 14.5px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #A8A29E; letter-spacing: 0.5px; }
      .st  { font: 600 12.5px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #D6D3D1; letter-spacing: 1px; }
      .std { font: 400 10.5px 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #78716C; letter-spacing: 1px; }
      .icon{ stroke: #CC785C; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .soft{ stroke: #57534E; stroke-width: 1.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1280" height="300" rx="18" fill="#1C1917"/>

  <!-- 背景点阵 -->
  <g fill="#57534E" opacity="0.5">
    <circle cx="700" cy="52" r="1"/><circle cx="780" cy="240" r="1.1"/><circle cx="1190" cy="60" r="1"/>
    <circle cx="1246" cy="180" r="0.8"/><circle cx="688" cy="150" r="0.8"/><circle cx="1120" cy="258" r="1"/>
  </g>

  <!-- ── 左：wordmark ── -->
  <rect x="56" y="54" width="26" height="2" fill="#CC785C"/>
  <text x="56" y="80" class="tag">GENESIS · V2</text>
  <text x="54" y="148" class="wm">Project Genesis</text>
  <text x="56" y="180" class="sub">多 LLM 语义荒原 · Agent 基因组自主进化实验平台</text>

  <!-- ── 右：DNA 双螺旋 ── -->
  <g transform="translate(1060,150)" opacity="0.9">
    <!-- 骨架 -->
    <path d="M 0 -92 Q 46 -46 0 0 Q -46 46 0 92" stroke="#CC785C" stroke-width="2" fill="none"/>
    <path d="M 76 -92 Q 30 -46 76 0 Q 122 46 76 92" stroke="#57534E" stroke-width="1.6" fill="none"/>
    <!-- 碱基横档：coral = 存活，灰 = 淘汰 -->
    <line x1="6"  y1="-76" x2="70" y2="-76" stroke="#57534E" stroke-width="1.2"/>
    <line x1="20" y1="-46" x2="56" y2="-46" stroke="#CC785C" stroke-width="1.6"/>
    <line x1="6"  y1="-16" x2="70" y2="-16" stroke="#CC785C" stroke-width="1.6"/>
    <line x1="20" y1="14"  x2="56" y2="14"  stroke="#57534E" stroke-width="1.2"/>
    <line x1="6"  y1="46"  x2="70" y2="46"  stroke="#CC785C" stroke-width="1.6"/>
    <line x1="20" y1="76"  x2="56" y2="76"  stroke="#57534E" stroke-width="1.2"/>
    <!-- 节点 -->
    <circle cx="0" cy="-92" r="3" fill="#CC785C"/>
    <circle cx="76" cy="-92" r="2.4" fill="#57534E"/>
    <circle cx="0" cy="0" r="3" fill="#CC785C"/>
    <circle cx="76" cy="0" r="2.4" fill="#57534E"/>
    <circle cx="0" cy="92" r="3" fill="#CC785C"/>
    <circle cx="76" cy="92" r="2.4" fill="#57534E"/>
  </g>

  <!-- ── 底部 stats ── -->
  <line x1="56" y1="226" x2="1224" y2="226" stroke="#2E2A27"/>
  <g transform="translate(56,254)">
    <circle cx="5" cy="-4" r="3" fill="#7BA05B"/>
    <text x="15" y="0" class="st">24 TESTS</text>
    <text x="15" y="17" class="std">回归全绿</text>

    <g transform="translate(250,0)">
      <circle cx="5" cy="-4" r="3" fill="#CC785C"/>
      <text x="15" y="0" class="st">6-STAGE LOOP</text>
      <text x="15" y="17" class="std">进化闭环</text>
    </g>

    <g transform="translate(500,0)">
      <circle cx="5" cy="-4" r="3" fill="#CC785C"/>
      <text x="15" y="0" class="st">MULTI-LLM ENV</text>
      <text x="15" y="17" class="std">互为环境</text>
    </g>

    <g transform="translate(760,0)">
      <circle cx="5" cy="-4" r="3" fill="#CC785C"/>
      <text x="15" y="0" class="st">ZERO CLOUD</text>
      <text x="15" y="17" class="std">纯本地零云依赖</text>
    </g>
  </g>
</svg>
